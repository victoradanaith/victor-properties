<title>ราคาตึกแถวราชเทวี</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: survey-ledger workspace. Header with subject valuation, tabbed panes (overview map + chart, ledger, deals, assumptions). */
:root{
  --bg:#eef1ef; --surface:#fbfcfb; --sunk:#e3e8e5; --line:#cdd5d1;
  --ink:#16251f; --muted:#5b6b64;
  --accent:#0f6b5c; --accent-soft:#d4ebe5;
  --gold:#b0811d; --gold-soft:#f5e8c8;
  --bts:#5aa832; --good:#1f7a3d; --good-soft:#dbefdf; --warn:#a2611a; --warn-soft:#f7e6d0; --bad:#b2392f; --bad-soft:#f6dcd8;
  --road:#bfc8c3; --water:#a9c7d8; --map-filter:none; --room:#3d5fa3; --room-soft:#dfe6f4;
  --f-display:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1714; --surface:#16211d; --sunk:#1d2a25; --line:#2c3b35; --ink:#e3ece8; --muted:#93a49c;
  --accent:#4fc0a8; --accent-soft:#16372f; --gold:#e0b04b; --gold-soft:#3a2f14; --bts:#7cc955;
  --good:#5fc27a; --good-soft:#163222; --warn:#e29a4e; --warn-soft:#3a2814; --bad:#ef7a6e; --bad-soft:#3d1c19; --road:#34443e; --water:#28465a; --map-filter:brightness(.82) contrast(1.05) saturate(.85); --room:#93b1ec; --room-soft:#1c2840; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1714; --surface:#16211d; --sunk:#1d2a25; --line:#2c3b35; --ink:#e3ece8; --muted:#93a49c;
  --accent:#4fc0a8; --accent-soft:#16372f; --gold:#e0b04b; --gold-soft:#3a2f14; --bts:#7cc955;
  --good:#5fc27a; --good-soft:#163222; --warn:#e29a4e; --warn-soft:#3a2814; --bad:#ef7a6e; --bad-soft:#3d1c19; --road:#34443e; --water:#28465a; --map-filter:brightness(.82) contrast(1.05) saturate(.85); --room:#93b1ec; --room-soft:#1c2840; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:1.65rem;font-weight:700}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:end;padding-bottom:16px;border-bottom:1px solid var(--line)}
.subject-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;color:var(--muted)}
.pin{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.valuation{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-width:260px}
.valuation .big{font-family:var(--f-display);font-size:1.6rem;font-weight:700;color:var(--gold)}
.status{font-size:.8rem;color:var(--muted);margin-top:8px}
.status.err{color:var(--bad)}

nav.tabs{display:flex;gap:4px;margin:16px 0;flex-wrap:wrap}
nav.tabs button{background:none;border:1px solid transparent;border-radius:8px;padding:7px 14px;color:var(--muted);font-weight:500}
nav.tabs button[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink)}
nav.tabs .count{font-family:var(--f-mono);font-size:.75rem;background:var(--sunk);border-radius:99px;padding:1px 7px;margin-left:6px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.stat .v{font-family:var(--f-mono);font-size:1.25rem;font-weight:500;margin-top:2px}
.stat .s{font-size:.78rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
svg text{font-family:var(--f-body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1 1 220px;min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 10px;width:100%}
.toolbar select{width:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 14px;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap;position:sticky;top:0}
td.r,th.r{text-align:right}
tbody tr:hover{background:var(--sunk)}
tbody tr{cursor:pointer}
tr:last-child td{border-bottom:none}
.t-title{font-weight:500}
.chip{display:inline-block;font-size:.72rem;border-radius:99px;padding:1px 8px;font-weight:600;white-space:nowrap}
.chip.shop{background:var(--accent-soft);color:var(--accent)}
.chip.rent{background:var(--gold-soft);color:var(--gold)}
.chip.sold{background:var(--ink);color:var(--surface)}
.chip.room{background:var(--room-soft);color:var(--room)}
.chip.condo{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ex{background:none;border:1px dashed var(--muted);color:var(--muted)}

.drawer{position:fixed;inset:0;background:rgba(10,20,16,.45);display:flex;justify-content:flex-end;z-index:20}
.drawer .sheet{background:var(--bg);width:min(560px,100%);height:100%;overflow-y:auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px 20px;padding-top:calc(20px + env(safe-area-inset-top,0px));border-left:1px solid var(--line)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:500}
.form .derived{grid-column:1/-1;background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:.85rem;display:flex;gap:16px;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.notice{background:var(--gold-soft);border:1px solid var(--gold);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:.85rem;margin-bottom:14px}
.prose{max-width:68ch}
.prose p{margin:.4em 0}
.settings{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.settings label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
.settings .hint{font-size:.74rem}
.dealcard{display:grid;grid-template-columns:minmax(0,1fr) repeat(5,minmax(0,auto));gap:6px 22px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.dealcard:last-child{border-bottom:none}
.dealcard .k{font-size:.72rem;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}header.top{grid-template-columns:minmax(0,1fr)}.dealcard{grid-template-columns:repeat(2,minmax(0,1fr))}.dealcard>:first-child{grid-column:1/-1}}
@media (max-width:480px){.form{grid-template-columns:minmax(0,1fr)}.valuation{min-width:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.lmap{height:480px;border-radius:8px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.lmap.small{height:280px}
.lmap .leaflet-image-layer{filter:var(--map-filter)}
.cu-tag{background:#c2185b;color:#fff;font-weight:700;font-size:11px;padding:2px 6px;border-radius:4px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.leaflet-container{font-family:var(--f-body)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--ink)}
.leaflet-popup-content{margin:10px 12px;font-size:.85rem;line-height:1.45}
.leaflet-control-attribution{font-size:10px}
.subj-pin{width:22px;height:22px;border-radius:50% 50% 50% 0;background:var(--gold);transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.map-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.picking .leaflet-container{cursor:crosshair!important}
@media (max-width:600px){.lmap{height:380px}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">สมุดราคาอ้างอิง · ย่านรถไฟฟ้าราชเทวี</div>

<script>
// ---------- constants ----------
const STATIONS=[
 {n:'BTS ราชเทวี',lat:13.7521,lng:100.5316,main:true},
 {n:'BTS พญาไท',lat:13.7570,lng:100.5340},
 {n:'BTS สยาม',lat:13.7456,lng:100.5341},
 {n:'BTS สนามกีฬาฯ',lat:13.7465,lng:100.5292},
 {n:'MRT สามย่าน',lat:13.7325,lng:100.5295},
 {n:'MRT หัวลำโพง',lat:13.7377,lng:100.5170}
];
const RATCHATHEWI=STATIONS[0];
const CHULA={n:'จุฬาฯ',lat:13.7388,lng:100.5322};
const REF=()=>S.publicView?'BTS ราชเทวี':'ทรัพย์หลัก';
const TYPES={
 shop_sale:{label:'ตึกแถวขาย',chip:'shop'},
 shop_sold:{label:'ตึกแถวขายแล้ว (ราคาจริง)',chip:'sold'},
 shop_rent:{label:'ตึกแถวให้เช่า',chip:'rent'},
 condo_sale:{label:'คอนโดขาย',chip:'condo'},
 condo_rent:{label:'คอนโดเช่า',chip:'condo'},
 room_rent:{label:'ห้องเช่า/หอพักรายเดือน',chip:'room'}
};
const CONDITIONS={orig:'สภาพเดิม ใช้ได้',full:'ต้องรีโนเวททั้งหลัง',ready:'พร้อมใช้',reno:'รีโนแล้ว'};
const STATUSES={active:'ยังขาย/ว่าง',talk:'กำลังคุย',done:'ปิดการขาย/เช่าแล้ว',gone:'หายไป/ถอนประกาศ'};
const DEFAULT_SETTINGS={
 subject:{name:'ตึกแถวใกล้ปั๊ม LPG',address:'ตึกแถวใกล้ปั๊ม LPG',lat:null,lng:null,landSqw:null,usableSqm:null,floors:null,units:1,notes:''},
 a:{radiusKm:1.5,negotiation:0.08,dealThreshold:0.15,buyCost:0.03,renoPerSqm:15000,resalePerSqm:85000,rentPerSqm:420,occupancy:0.9,sellCost:0.05,condoSalePerSqm:150000,condoRentPerSqm:650,useCondoData:true,chulaRadiusKm:1.5,suiteSqm:40,suiteFitout:250000,suiteRentFactor:0.75,suiteRent:25000,suiteOcc:0.9,suiteOpex:0.15}
};

// ---------- state ----------
const S={listings:[],settings:structuredClone(DEFAULT_SETTINGS),tab:'overview',q:'',ftype:'all',fexample:'all',sort:'dist',db:null,canWrite:true,loaded:false};
function loadPrefs(){try{const p=JSON.parse(localStorage.getItem('rt-prefs')||'{}');if(p.tab)S.tab=p.tab;if(p.sort)S.sort=p.sort;}catch(e){}}
function savePrefs(){try{localStorage.setItem('rt-prefs',JSON.stringify({tab:S.tab,sort:S.sort}))}catch(e){}}
loadPrefs();
if(['overview','ledger','deals','settings'].includes(location.hash.slice(1)))S.tab=location.hash.slice(1);

// ---------- helpers ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>(v===''||v==null||isNaN(+v))?null:+v;
function hav(a,b){if(a.lat==null||b.lat==null||a.lng==null||b.lng==null)return null;const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lng-a.lng);const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function mb(v,d=2){if(v==null||!isFinite(v))return '—';return (v/1e6).toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d})+' ล.';}
function baht(v){if(v==null||!isFinite(v))return '—';return Math.round(v).toLocaleString('th-TH');}
function pct(v,d=0){if(v==null||!isFinite(v))return '—';return (v>0?'+':'')+(v*100).toFixed(d)+'%';}
function km(v){if(v==null)return '—';return v<1?Math.round(v*1000)+' ม.':v.toFixed(2)+' กม.';}
function quant(arr,q){const a=arr.filter(x=>x!=null&&isFinite(x)).sort((x,y)=>x-y);if(!a.length)return null;const p=(a.length-1)*q,lo=Math.floor(p),hi=Math.ceil(p);return a[lo]+(a[hi]-a[lo])*(p-lo);}
function parseMaps(s){if(!s)return null;let m=s.match(/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/)||s.match(/[?&]q=(-?\d+\.\d+),\s*(-?\d+\.\d+)/)||s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||s.match(/^\s*(-?\d{1,2}\.\d+)\s*,\s*(-?\d{2,3}\.\d+)\s*$/);return m?{lat:+m[1],lng:+m[2]}:null;}

// ---------- derived ----------
function derive(l){
 const subj=S.settings.subject;
 const d={...l};
 d.price=num(l.price);d.rent=num(l.rent);d.landSqw=num(l.landSqw);d.usableSqm=num(l.usableSqm);
 d.ppw=(d.price&&d.landSqw)?d.price/d.landSqw:null;
 d.ppm=(d.price&&d.usableSqm)?d.price/d.usableSqm:null;
 d.rpm=(d.rent&&d.usableSqm)?d.rent/d.usableSqm:null;
 d.distBts=hav(l,RATCHATHEWI);d.distSubj=hav(l,subj);d.distChula=hav(l,CHULA);
 return d;
}
function market(){
 const a=S.settings.a;const L=S.listings.map(derive);
 const inR=x=>x.distSubj==null||x.distSubj<=a.radiusKm;
 const asks=L.filter(x=>x.type==='shop_sale'&&x.ppw&&inR(x)&&!x.example);
 const sold=L.filter(x=>x.type==='shop_sold'&&x.ppw&&inR(x)&&!x.example);
 const askMed=quant(asks.map(x=>x.ppw),.5);
 const soldMed=quant(sold.map(x=>x.ppw),.5);
 let mkt=null,basis='';
 if(sold.length>=2){mkt=soldMed;basis=`มัธยฐานราคาขายจริง ${sold.length} รายการ`;}
 else if(askMed!=null){mkt=askMed*(1-a.negotiation);basis=`มัธยฐานราคาประกาศ ${asks.length} รายการ หักต่อรอง ${Math.round(a.negotiation*100)}%`;}
 const lo=quant((sold.length>=2?sold.map(x=>x.ppw):asks.map(x=>x.ppw*(1-a.negotiation))),.25);
 const hi=quant((sold.length>=2?sold.map(x=>x.ppw):asks.map(x=>x.ppw*(1-a.negotiation))),.75);
 const askPpm=quant(asks.map(x=>x.ppm),.5);
 const rents=L.filter(x=>x.type==='shop_rent'&&x.rpm&&inR(x)&&!x.example);
 const rentMed=quant(rents.map(x=>x.rpm),.5);
 const condoS=L.filter(x=>x.type==='condo_sale'&&x.ppm&&!x.example);
 const condoR=L.filter(x=>x.type==='condo_rent'&&x.rpm&&!x.example);
 const condoSale=(a.useCondoData&&condoS.length>=3)?quant(condoS.map(x=>x.ppm),.5):a.condoSalePerSqm;
 const condoRent=(a.useCondoData&&condoR.length>=3)?quant(condoR.map(x=>x.rpm),.5):a.condoRentPerSqm;
 const nearCU=x=>x.distChula!=null&&x.distChula<=a.chulaRadiusKm&&!x.example;
 const cuS=L.filter(x=>x.type==='condo_sale'&&x.price&&nearCU(x)),cuR=L.filter(x=>x.type==='condo_rent'&&x.rent&&nearCU(x));
 const cu={sale:cuS,rent:cuR,salePpm:quant(cuS.map(x=>x.ppm),.5),saleUnit:quant(cuS.map(x=>x.price),.5),unitSqm:quant(cuS.map(x=>x.usableSqm),.5),rentUnit:quant(cuR.map(x=>x.rent),.5),rentPpm:quant(cuR.map(x=>x.rpm),.5)};
 cu.suiteRent=cu.rent.length>=3?cu.rentUnit*a.suiteRentFactor:a.suiteRent;cu.rentFromData=cu.rent.length>=3;
 return {L,cu,asks,sold,askMed,soldMed,mkt,lo,hi,basis,askPpm,rents,rentMed,condoSale,condoRent,condoSFromData:a.useCondoData&&condoS.length>=3,condoRFromData:a.useCondoData&&condoR.length>=3,condoS,condoR};
}
function dealCalc(x,M){
 const a=S.settings.a;if(!x.price)return null;
 const u=x.usableSqm;
 const reno=u?(x.condition==='ready'||x.condition==='reno'?0.35:1)*a.renoPerSqm*u:null;
 const allIn=x.price*(1+a.buyCost)+(reno||0);
 const perSqm=u?allIn/u:null;
 const exit=u?u*a.resalePerSqm*(1-a.sellCost):null;
 const profit=exit!=null?exit-allIn:null;
 const yld=u?(u*a.rentPerSqm*12*a.occupancy)/allIn:null;
 const vsCondo=perSqm?perSqm/M.condoSale-1:null;
 const condoEq=u?u*M.condoSale:null; // what the same area costs as condo
 const disc=(M.mkt&&x.ppw)?(x.ppw*(1-a.negotiation))/M.mkt-1:null;
 const suites=u?Math.floor(u/a.suiteSqm):null;
 const cuCost=suites?allIn+suites*a.suiteFitout:null;
 const perSuite=suites?cuCost/suites:null;
 const vsCuUnit=(perSuite&&M.cu.saleUnit)?perSuite/M.cu.saleUnit-1:null;
 const cuYld=suites?suites*M.cu.suiteRent*12*a.suiteOcc*(1-a.suiteOpex)/cuCost:null;
 return {reno,allIn,perSqm,exit,profit,margin:profit!=null?profit/allIn:null,yld,vsCondo,condoEq,disc,suites,cuCost,perSuite,vsCuUnit,cuYld};
}

// ---------- db ----------
const setStatus=(t,err)=>{const el=$('#status');el.textContent=t;el.className='status'+(err?' err':'');};
async function boot(){
 render();
 const t=setTimeout(()=>{if(!S.loaded)setStatus('ยังเชื่อมต่อฐานข้อมูลไม่ได้ ข้อมูลที่เห็นอาจไม่ครบ',true)},10000);
 let db=null;try{db=await window.claude?.use?.('db');}catch(e){}
 if(!db){clearTimeout(t);S.canWrite=false;
   // Outside Claude (e.g. GitHub Pages): load the read-only snapshot published next to the page.
   try{
     const r=await fetch('data/snapshot.json',{cache:'no-store'});
     if(!r.ok)throw new Error(r.status);
     const snap=await r.json();
     S.listings=snap.listings||[];S.publicView=!!snap.public;
     if(snap.settings)S.settings={subject:{...DEFAULT_SETTINGS.subject,...(snap.settings.subject||{})},a:{...DEFAULT_SETTINGS.a,...(snap.settings.a||{})}};
     setStatus(`ฉบับอ่านอย่างเดียว · ${S.listings.length} รายการ · ข้อมูล ณ ${snap.exportedAt||'-'}`);
   }catch(e){setStatus('ไม่มีฐานข้อมูลในมุมมองนี้ ลงชื่อเข้าใช้ claude.ai เพื่อดูและบันทึกข้อมูล',true);}
   S.loaded=true;render();return;}
 S.db=db;
 db.collection('listings').onSnapshot(snap=>{
   S.listings=snap.docs.map(d=>({id:d.id,...d.data()}));
   if(!snap.metadata.fromCache){S.loaded=true;clearTimeout(t);setStatus(`บันทึกไว้ ${S.listings.length} รายการ · อัปเดตสด`);}
   render();
 },e=>{clearTimeout(t);setStatus('อ่านฐานข้อมูลไม่ได้ ('+e.code+')',true);});
 db.doc('settings/main').onSnapshot(s=>{
   if(s.exists){const d=s.data();S.settings={subject:{...DEFAULT_SETTINGS.subject,...(d.subject||{})},a:{...DEFAULT_SETTINGS.a,...(d.a||{})}};}
   render();
 },()=>{});
}
async function saveSettings(){
 if(!S.db)return;
 try{await S.db.doc('settings/main').set(JSON.parse(JSON.stringify(S.settings)));toast('บันทึกแล้ว');}
 catch(e){handleWriteErr(e);}
}
function handleWriteErr(e){if(e&&e.code==='invalid_argument'){S.canWrite=false;setStatus('บัญชีนี้ดูได้อย่างเดียว แก้ไขข้อมูลไม่ได้',true);render();}else toast('บันทึกไม่สำเร็จ: '+(e?.code||e));}
let toastT;function toast(m){setStatus(m);clearTimeout(toastT);toastT=setTimeout(()=>setStatus(`บันทึกไว้ ${S.listings.length} รายการ · อัปเดตสด`),2500);}

// ---------- render ----------
function render(){
 const M=market();
 renderHeader(M);
 const tabs=[['overview','ภาพรวม'],['ledger','รายการทั้งหมด',S.listings.length],['deals','หาดีล',M.L.filter(x=>x.type==='shop_sale'&&x.status!=='done'&&x.status!=='gone').length],['settings',S.publicView?'สมมติฐาน':'ทรัพย์หลัก & สมมติฐาน']];
 $('#tabs').innerHTML=tabs.map(([k,l,c])=>`<button role="tab" aria-selected="${S.tab===k}" data-tab="${k}">${l}${c!=null?`<span class="count">${c}</span>`:''}</button>`).join('');
 const v=$('#view');
 if(S.tab==='overview'){v.innerHTML=viewOverview(M);mountMainMap(M);}
 else if(S.tab==='ledger')v.innerHTML=viewLedger(M);
 else if(S.tab==='deals')v.innerHTML=viewDeals(M);
 else v.innerHTML=viewSettings(M);
}
function renderHeader(M){
 const s=S.settings.subject;$('#subjAddr').textContent=s.address;
 if(S.publicView){$('#subjAddr').parentElement.hidden=true;$('#valuation').innerHTML=`<div class="eyebrow">ราคาตลาดตึกแถว รอบ BTS ราชเทวี</div><div class="big num">${M.mkt?mb(M.mkt):'—'}<span class="small muted"> /ตร.ว.</span></div><div class="small muted">${esc(M.basis||'')}</div>`;return;}
 let h='<div class="eyebrow">มูลค่าประมาณของทรัพย์หลัก</div>';
 if(!M.mkt)h+=`<div class="big">—</div><div class="small muted">ยังไม่มีตึกแถวเทียบในรัศมี ${S.settings.a.radiusKm} กม.</div>`;
 else if(!num(s.landSqw))h+=`<div class="big num">${mb(M.mkt)}<span class="small muted"> /ตร.ว.</span></div><div class="small muted">กรอกขนาดที่ดินในแท็บ "ทรัพย์หลัก" เพื่อคำนวณมูลค่ารวม</div>`;
 else{const w=+s.landSqw;h+=`<div class="big num">${mb(M.mkt*w,1)}</div><div class="small muted num">ช่วง ${mb(M.lo*w,1)} – ${mb(M.hi*w,1)} · ${w} ตร.ว. × ${mb(M.mkt)}/ตร.ว.</div><div class="small muted">${esc(M.basis)}</div>`;}
 $('#valuation').innerHTML=h;
}

function viewOverview(M){
 const a=S.settings.a;
 const nEx=S.listings.filter(x=>x.example).length;
 return `
 ${nEx?`<div class="notice">มี ${nEx} รายการที่เป็นตัวอย่าง (ไม่นำไปคำนวณ) ลบได้ในแท็บรายการทั้งหมด</div>`:''}
 <div class="stats">
  <div class="stat"><div class="eyebrow">ราคาประกาศ ตึกแถว</div><div class="v">${mb(M.askMed)}<span class="small muted"> /ตร.ว.</span></div><div class="s">มัธยฐาน ${M.asks.length} รายการ ในรัศมี ${a.radiusKm} กม.</div></div>
  <div class="stat"><div class="eyebrow">ราคาขายจริง</div><div class="v">${mb(M.soldMed)}<span class="small muted"> /ตร.ว.</span></div><div class="s">${M.sold.length?M.sold.length+' รายการ':'ยังไม่มีข้อมูลขายจริง'}</div></div>
  <div class="stat"><div class="eyebrow">ค่าเช่าตึกแถว</div><div class="v">${M.rentMed?baht(M.rentMed):'—'}<span class="small muted"> ฿/ตร.ม./ด.</span></div><div class="s">${M.rents.length?M.rents.length+' รายการ':'ยังไม่มีข้อมูลค่าเช่า'}</div></div>
  <div class="stat"><div class="eyebrow">คอนโดราชเทวี</div><div class="v">${baht(M.condoSale)}<span class="small muted"> ฿/ตร.ม.</span></div><div class="s">${M.condoSFromData?'มัธยฐาน '+M.condoS.length+' รายการ':'ค่าตั้งต้น ปรับได้ในสมมติฐาน'}</div></div>
  <div class="stat"><div class="eyebrow">คอนโดใกล้จุฬาฯ</div><div class="v">${M.cu.salePpm?baht(M.cu.salePpm):'—'}<span class="small muted"> ฿/ตร.ม.</span></div><div class="s">${M.cu.sale.length?'ขาย '+M.cu.sale.length+' ห้อง มัธยฐาน '+mb(M.cu.saleUnit,1)+'/ห้อง':'ยังไม่มีข้อมูล'}${M.cu.rent.length?' · เช่า '+baht(M.cu.rentUnit)+' ฿/ด.':''}</div></div>
 </div>
 <div class="grid2">
  <section class="panel"><div class="panel-head"><h2>แผนที่ทรัพย์</h2><span class="small muted">เส้นประ 500 ม. และ 1 กม. รอบ BTS ราชเทวี</span></div><div id="mainMapSlot"></div>
   <div class="map-tools">
    <button class="btn primary" data-act="pinNew" ${S.canWrite?'':'disabled'}>+ ปักหมุดทรัพย์ใหม่</button>
    <span class="small muted" id="pinHint">${S.pickNew?'คลิกบนแผนที่ตรงตำแหน่งทรัพย์ <button class="btn ghost small" data-act="pinCancel">ยกเลิก</button>':(S.publicView?'คลิกจุดเพื่อดูรายละเอียด':'ลากหมุดสีทองเพื่อย้ายตำแหน่งทรัพย์หลัก คลิกจุดอื่นเพื่อดูรายละเอียด')}</span>
   </div>
   <div class="legend">${S.publicView?'':'<span><i style="background:var(--gold)"></i>ทรัพย์หลัก</span>'}<span><i style="background:var(--accent)"></i>ตึกแถวขาย</span><span><i style="background:var(--ink)"></i>ขายแล้ว</span><span><i style="background:var(--warn)"></i>ให้เช่า</span><span><i style="background:var(--muted)"></i>คอนโด</span><span><i style="background:var(--room)"></i>ห้องเช่า/หอพัก</span><span><i style="background:#c2185b"></i>จุฬาฯ</span></div></section>
  <section class="panel"><div class="panel-head"><h2>ราคาต่อตารางวา เทียบระยะทาง</h2><span class="small muted">ตึกแถวขาย/ขายแล้ว</span></div>${chartSvg(M)}
   <p class="small muted">แกนนอนคือระยะจาก${REF()} เส้นประคือมูลค่าตลาดที่ใช้ประเมิน (${esc(M.basis||'ยังไม่มีข้อมูล')})</p></section>
 </div>`;
}

// ---------- real map (Leaflet + stitched OpenStreetMap image) ----------
const MAP_IMG=window.claude?'ratchathewi-map-z17.jpg':'assets/ratchathewi-map-z17.jpg';
const MAP_B=[[13.723376590315016,100.5084228515625],[13.766063482382863,100.5523681640625]];
const OSM_ATTR='© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors';
const tok=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888';
const hasL=()=>typeof L!=='undefined';
function baseMap(el){
 const m=L.map(el,{minZoom:14,maxZoom:19,zoomSnap:0.5,maxBounds:L.latLngBounds(MAP_B).pad(0.1)});
 L.imageOverlay(MAP_IMG,MAP_B,{attribution:OSM_ATTR}).addTo(m);
 m.attributionControl.setPrefix(false);
 return m;
}
function subjIcon(){return L.divIcon({className:'',html:'<div class="subj-pin"></div>',iconSize:[22,22],iconAnchor:[11,27],tooltipAnchor:[0,-26]});}
function typeColor(t){return t==='shop_sale'?tok('--accent'):t==='shop_sold'?tok('--ink'):t==='shop_rent'?tok('--warn'):t==='room_rent'?tok('--room'):tok('--muted');}
let MM=null;
function mountMainMap(M){
 const slot=$('#mainMapSlot');if(!slot)return;
 if(!hasL()){slot.innerHTML='<div class="empty">โหลดแผนที่ไม่สำเร็จ ลองเปิดหน้าใหม่</div>';return;}
 if(!MM){
  const el=document.createElement('div');el.className='lmap';slot.appendChild(el);
  const map=baseMap(el);map.setView([13.7495,100.5275],16);
  [500,1000].forEach(r=>L.circle([RATCHATHEWI.lat,RATCHATHEWI.lng],{radius:r,color:tok('--bts'),weight:2,dashArray:'6 6',fill:false,interactive:false}).addTo(map));
  L.marker([CHULA.lat,CHULA.lng],{icon:L.divIcon({className:'',html:'<div class="cu-tag">จุฬาฯ</div>',iconSize:[44,20],iconAnchor:[22,10]}),interactive:false}).addTo(map);
  const layer=L.layerGroup().addTo(map);

function chartSvg(M){
 const pts=M.L.filter(x=>(x.type==='shop_sale'||x.type==='shop_sold')&&x.ppw&&x.distSubj!=null);
 if(!pts.length)return `<div class="empty">เพิ่มตึกแถวที่มีราคาและขนาดที่ดินเพื่อดูกราฟ</div>`;
 const W=560,H=320,L=56,R=16,T=16,B=40;
 const xmax=Math.max(1,Math.ceil(Math.max(...pts.map(p=>p.distSubj))*2)/2);
 const ymaxRaw=Math.max(...pts.map(p=>p.ppw),M.mkt||0)/1e6;const step=ymaxRaw>2.5?0.5:0.25;const ymax=Math.ceil(ymaxRaw/step)*step+step;
 const X=v=>L+(v/xmax)*(W-L-R),Y=v=>T+(1-v/ymax)*(H-T-B);
 let g=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="กราฟราคาต่อตารางวา">`;
 for(let v=0;v<=ymax+1e-9;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" class="num">${v.toFixed(2)}</text>`;}
 for(let v=0;v<=xmax+1e-9;v+=0.5){g+=`<text x="${X(v)}" y="${H-B+18}" text-anchor="middle" font-size="11" fill="var(--muted)">${v.toFixed(1)}</text>`;}
 g+=`<text x="${(L+W-R)/2}" y="${H-4}" text-anchor="middle" font-size="11" fill="var(--muted)">ระยะจาก${REF()} (กม.)</text><text x="12" y="${T+4}" font-size="11" fill="var(--muted)">ล้าน/ตร.ว.</text>`;
 if(M.mkt){g+=`<line x1="${L}" x2="${W-R}" y1="${Y(M.mkt/1e6)}" y2="${Y(M.mkt/1e6)}" stroke="var(--gold)" stroke-width="2" stroke-dasharray="6 4"/><text x="${W-R}" y="${Y(M.mkt/1e6)-6}" text-anchor="end" font-size="11" font-weight="600" fill="var(--gold)">ตลาด ${mb(M.mkt)}</text>`;}
 g+=`<line x1="${X(S.settings.a.radiusKm)}" x2="${X(S.settings.a.radiusKm)}" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="2 4" opacity="${S.settings.a.radiusKm<=xmax?1:0}"/>`;
 pts.forEach(p=>{g+=`<g data-open="${esc(p.id)}" style="cursor:pointer"><circle cx="${X(p.distSubj)}" cy="${Y(p.ppw/1e6)}" r="6" fill="${p.type==='shop_sold'?'var(--ink)':'var(--accent)'}" stroke="var(--surface)" stroke-width="1.5" ${p.example?'opacity=".45"':''}/><title>${esc(p.title)} · ${mb(p.ppw)}/ตร.ว. · ${km(p.distSubj)}</title></g>`;});
 return g+'</svg>';
}

   ${M.rentMed&&num(s.usableSqm)?` · ค่าเช่าตลาด ~<b class="num">${baht(M.rentMed*s.usableSqm)}</b> ฿/ด.`:''}
  </div>
  <p class="small muted">หมุดวางตามตำแหน่งที่คุณระบุบนแผนที่ ปรับละเอียดได้โดยลากหมุดสีทองบนแผนที่ในแท็บภาพรวม หรือวางลิงก์ Google Maps ของตึกจริงด้านบน ตึกที่ติดปั๊มแก๊ส LPG อาจถูกผู้ซื้อบางกลุ่มกดราคาเรื่องความปลอดภัย ควรเก็บราคาตึกที่ติดปั๊มเทียบไว้ด้วย</p>
 </section>`}
 <section class="panel"><div class="panel-head"><h2>สมมติฐานการคำนวณ</h2></div>
  <div class="settings">
   ${f('radiusKm','รัศมีตึกเทียบ (กม.)',a.radiusKm,'วัดจาก'+REF())}
   ${f('negotiation','ส่วนลดจากการต่อรอง',a.negotiation,'0.08 = ราคาประกาศลด 8%')}
   ${f('dealThreshold','เกณฑ์ "ต่ำกว่าตลาด"',a.dealThreshold,'0.15 = ต่ำกว่าตลาด 15%')}
   ${f('buyCost','ค่าใช้จ่ายตอนซื้อ',a.buyCost,'ค่าโอน อากร ส่วนของผู้ซื้อ')}
   ${f('renoPerSqm','ค่ารีโนเวท (฿/ตร.ม.)',a.renoPerSqm,'ทั้งหลัง รวมระบบไฟ ประปา')}
   ${f('resalePerSqm','ราคาขายหลังรีโน (฿/ตร.ม.)',a.resalePerSqm,'ต่อพื้นที่ใช้สอย')}
   ${f('sellCost','ค่าใช้จ่ายตอนขาย',a.sellCost,'ค่านายหน้า ภาษีธุรกิจเฉพาะ')}
   ${f('rentPerSqm','ค่าเช่าทั้งตึกหลังรีโน (฿/ตร.ม./ด.)',a.rentPerSqm)}
   ${f('occupancy','อัตราการเช่า',a.occupancy,'0.9 = 90%')}
   ${f('condoSalePerSqm','ราคาคอนโดอ้างอิง (฿/ตร.ม.)',a.condoSalePerSqm,'ใช้เมื่อมีข้อมูลคอนโดไม่ถึง 3 รายการ')}
   ${f('condoRentPerSqm','ค่าเช่าคอนโดอ้างอิง (฿/ตร.ม./ด.)',a.condoRentPerSqm)}
   <label>ใช้ข้อมูลคอนโดที่บันทึกไว้<select data-a="useCondoData" ${dis}><option value="true" ${a.useCondoData?'selected':''}>ใช่ เมื่อมีตั้งแต่ 3 รายการ</option><option value="false" ${a.useCondoData?'':'selected'}>ไม่ ใช้ค่าอ้างอิงเสมอ</option></select></label>
   ${f('chulaRadiusKm','รัศมีคอนโดเทียบรอบจุฬาฯ (กม.)',a.chulaRadiusKm)}
   ${f('suiteSqm','พื้นที่ต่อห้องชุดในตึก (ตร.ม.)',a.suiteSqm,'รวมทางเดินและบันได')}
   ${f('suiteFitout','ค่าทำห้องชุด (฿/ห้อง)',a.suiteFitout,'ห้องน้ำ ครัวเล็ก แอร์ เฟอร์นิเจอร์')}
   ${f('suiteRentFactor','ค่าเช่าเทียบคอนโดจุฬาฯ',a.suiteRentFactor,'0.75 = 75% ของค่าเช่าคอนโด')}
   ${f('suiteRent','ค่าเช่าห้องชุดอ้างอิง (฿/ด.)',a.suiteRent,'ใช้เมื่อมีคอนโดเช่าใกล้จุฬาฯ ไม่ถึง 3 ห้อง')}
   ${f('suiteOcc','อัตราเข้าพักห้องชุด',a.suiteOcc)}
   ${f('suiteOpex','ค่าดำเนินการห้องชุด',a.suiteOpex,'ส่วนกลาง แม่บ้าน ซ่อมบำรุง')}
  </div>
  <p class="small muted">ค่าตั้งต้นเป็นตัวเลขกลางๆ สำหรับเริ่มต้น ควรปรับตามใบเสนอราคาผู้รับเหมาและข้อมูลที่เก็บได้จริง</p>
 </section></div>`;
}

// ---------- drawer (add/edit) ----------
const FIELDS=['type','title','location','lat','lng','landSqw','usableSqm','floors','units','frontageM','price','rent','date','sourceUrl','contact','condition','status','notes','verified'];
function openDrawer(id,preset){
 if(DM){DM.remove();DM=null;}
 const ex=id?S.listings.find(x=>x.id===id):null;
 const x=ex||{type:'shop_sale',status:'active',condition:'orig',date:new Date().toISOString().slice(0,10),units:1,...(preset||{})};
 const dis=S.canWrite?'':'disabled';
 const sel=(k,obj)=>`<select id="f_${k}" ${dis}>${Object.entries(obj).map(([v,l])=>`<option value="${v}" ${x[k]===v?'selected':''}>${typeof l==='string'?l:l.label}</option>`).join('')}</select>`;
 const inp=(k,l,type='text',cls='')=>`<label class="${cls}">${l}<input id="f_${k}" type="${type}" ${type==='number'?'step="any"':''} value="${esc(x[k]??'')}" ${dis}></label>`;
 $('#drawerRoot').innerHTML=`<div class="drawer" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="แก้ไขรายการ">
  <div class="panel-head"><h2>${ex?'แก้ไขรายการ':'เพิ่มรายการ'}</h2><button class="btn ghost" data-act="close" aria-label="ปิด">ปิด</button></div>
  ${ex&&ex.example?'<div class="notice">รายการนี้เป็นตัวอย่าง ไม่นำไปคำนวณ</div>':''}
  <form class="form" id="lform">
   <label>ประเภท${sel('type',TYPES)}</label>
   <label>สถานะ${sel('status',STATUSES)}</label>
   ${inp('title','ชื่อรายการ','text','full')}
   ${inp('location','ทำเล / ซอย','text','full')}
   <div class="full"><div id="pickMap" class="lmap small"></div><div class="small muted" style="margin-top:4px">คลิกบนแผนที่เพื่อปักหมุดตำแหน่งทรัพย์${x.lat!=null?` · <a href="https://www.google.com/maps?q=${x.lat},${x.lng}" target="_blank" rel="noopener">เปิดใน Google Maps</a>`:''}</div></div>
   <label class="full">หรือวางลิงก์ Google Maps / "lat, lng"<input id="f_maps" placeholder="ระบบจะดึงพิกัดให้" ${dis}></label>
   ${inp('lat','ละติจูด','number')}${inp('lng','ลองจิจูด','number')}
   ${inp('landSqw','ที่ดิน (ตร.ว.)','number')}${inp('usableSqm','พื้นที่ใช้สอย (ตร.ม.)','number')}
   ${inp('floors','จำนวนชั้น','number')}${inp('units','จำนวนคูหา','number')}
   ${inp('frontageM','หน้ากว้าง (ม.)','number')}
   <label>สภาพ${sel('condition',CONDITIONS)}</label>
   ${inp('price','ราคาขาย (บาท)','number')}${inp('rent','ค่าเช่า (บาท/เดือน)','number')}
   ${inp('date','วันที่ประกาศ/ข้อมูล','date')}${inp('contact','ผู้ติดต่อ','text')}
   ${inp('sourceUrl','ลิงก์ประกาศ','url','full')}
   <label class="full">หมายเหตุ<textarea id="f_notes" rows="3" ${dis}>${esc(x.notes||'')}</textarea></label>
   <label class="full" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="f_verified" style="width:auto" ${x.verified?'checked':''} ${dis}> ตรวจสอบกับผู้ขาย/โฉนดแล้ว</label>
   <div class="derived" id="fderived"></div>
  </form>
  ${x.sourceUrl?`<p class="small"><a href="${esc(x.sourceUrl)}" target="_blank" rel="noopener">เปิดประกาศต้นทาง</a></p>`:''}
  <div class="actions">
   <button class="btn primary" data-act="save" ${dis}>บันทึก</button>
   ${ex?`<button class="btn danger" data-act="del" ${dis}>ลบรายการ</button>`:''}
   <span id="formMsg" class="small muted"></span>
  </div></div></div>`;
 $('#drawerRoot').dataset.id=id||'';
 updDerived();
 mountPicker(x);
}
function readForm(){const o={};FIELDS.forEach(k=>{const el=$('#f_'+k);if(!el)return;if(k==='verified')o[k]=el.checked;else if(el.type==='number')o[k]=num(el.value);else o[k]=el.value.trim();});return o;}
function updDerived(){const el=$('#fderived');if(!el)return;const d=derive(readForm());el.innerHTML=`<span>ต่อ ตร.ว. <b class="num">${mb(d.ppw)}</b></span><span>ต่อ ตร.ม. <b class="num">${d.ppm?baht(d.ppm):'—'}</b></span><span>ค่าเช่า/ตร.ม. <b class="num">${d.rpm?baht(d.rpm):'—'}</b></span><span>ห่างทรัพย์หลัก <b class="num">${km(d.distSubj)}</b></span><span>ห่าง BTS ราชเทวี <b class="num">${km(d.distBts)}</b></span>`;}
let delArm=false;
async function saveListing(){
 if(!S.db){$('#formMsg').textContent='ยังไม่ได้เชื่อมต่อฐานข้อมูล บันทึกไม่ได้';return;}
 const o=readForm();if(!o.title){$('#formMsg').textContent='ใส่ชื่อรายการก่อนบันทึก';return;}
 const id=$('#drawerRoot').dataset.id;const ex=id?S.listings.find(x=>x.id===id):null;
 o.example=ex?!!ex.example:false;o.updatedAt=new Date().toISOString();
 try{if(id)await S.db.doc('listings/'+id).set(o);else await S.db.collection('listings').add(o);closeDrawer();toast('บันทึกแล้ว');}
 catch(e){handleWriteErr(e);}
}
function closeDrawer(){if(DM){DM.remove();DM=null;DMk=null;}$('#drawerRoot').innerHTML='';delArm=false;}

// ---------- events ----------
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-tab],[data-act],[data-open]');if(!t)return;
 if(t.dataset.tab){S.tab=t.dataset.tab;savePrefs();history.replaceState(null,'','#'+S.tab);render();return;}
 const act=t.dataset.act;
 if(act==='close'){if(e.target===t||t.tagName==='BUTTON')closeDrawer();return;}
 if(act==='new'){openDrawer(null);return;}
 if(act==='pinNew'){S.pickNew=true;render();$('#mainMapSlot')?.scrollIntoView({block:'center',behavior:'smooth'});return;}
 if(act==='pinCancel'){S.pickNew=false;render();return;}
 if(act==='save'){saveListing();return;}
 if(act==='del'){if(!delArm){delArm=true;t.textContent='กดอีกครั้งเพื่อยืนยันการลบ';return;}const id=$('#drawerRoot').dataset.id;try{await S.db.doc('listings/'+id).delete();closeDrawer();toast('ลบแล้ว');}catch(err){handleWriteErr(err);}return;}
 if(act==='clearEx'){if(t.dataset.armed!=='1'){t.dataset.armed='1';t.textContent='ยืนยัน ลบตัวอย่างทั้งหมด';return;}for(const x of S.listings.filter(x=>x.example)){try{await S.db.doc('listings/'+x.id).delete();}catch(err){handleWriteErr(err);break;}}toast('ลบตัวอย่างแล้ว');return;}
 if(t.dataset.open&&!t.closest('.drawer')){openDrawer(t.dataset.open);}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='q'){S.q=t.value;const pos=t.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos);return;}
 if(t.id==='f_maps'){const p=parseMaps(t.value);if(p){$('#f_lat').value=p.lat;$('#f_lng').value=p.lng;syncPick();}}
 if(t.id==='f_lat'||t.id==='f_lng')syncPick();
 if(t.id&&t.id.startsWith('f_'))updDerived();
});
let setT;
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='ftype'){S.ftype=t.value;render();return;}
 if(t.id==='sort'){S.sort=t.value;savePrefs();render();return;}
 if(t.id==='subjMaps'){const p=parseMaps(t.value);if(p){S.settings.subject.lat=p.lat;S.settings.subject.lng=p.lng;saveSettings();render();}else toast('อ่านพิกัดจากลิงก์นี้ไม่ได้ ลองเปิดหมุดใน Google Maps แล้วคัดลอกลิงก์ที่มี @lat,lng');return;}
 if(t.dataset.s){const k=t.dataset.s;S.settings.subject[k]=t.type==='number'?num(t.value):t.value;saveSettings();render();return;}
 if(t.dataset.a){const k=t.dataset.a;S.settings.a[k]=k==='useCondoData'?t.value==='true':num(t.value)??DEFAULT_SETTINGS.a[k];saveSettings();render();return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();if(S.pickNew){S.pickNew=false;render();}}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['overview','ledger','deals','settings'].includes(h)){S.tab=h;render();}});
boot();
</script>

</body></html>
